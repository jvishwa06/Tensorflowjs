<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Classification with TensorFlow.js</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h3>Image Classification with TensorFlow.js</h3>
        <input type="file" id="imageUpload" accept="image/*">
        <img id="previewImage" class="hidden" />
        <button id="classifyButton">Classify Image</button>
        <div id="predictions"></div>
    </div>

    <script src="inference.js"></script>
</body>
</html>
